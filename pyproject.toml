[project]
name = "cst-help-mcp"
version = "0.1.0"
description = "Build a private Knowledge Base from your own CST Studio Suite help that coding agents read as a folder"
readme = "README.md"
license = "MIT"
authors = [
    { name = "André Kühne", email = "andre.kuehne@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13",
    "pillow>=11",
    "resvg-py>=0.5",
]

[project.scripts]
cst-help = "cst_help_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.15",
    "ruff>=0.12",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
