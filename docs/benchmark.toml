# The retrieval benchmark for the CST Studio Suite 2024 Knowledge Base, in the form the runner scores
# (`cst-help benchmark`). docs/benchmark-draft.md explains each question: why its sources answer it,
# its risks and how it is scored. This file holds no vendor text: questions and short queries are our
# own words, and sources are source paths, anchors, headings and PDF pages.
#
# - `half` splits the questions once into a tuning and a held-out half, stratified by category with a
#   fixed seed. A weight change counts as better only if the held-out half improves too. A new
#   question without one falls into a half by a hash of its id; one from the query log is held out.
# - `areas` is the filter an agent would plausibly use; [] for none.
# - `sources` are listed best first, with paths relative to the corpus root. The runner maps them to
#   Locators mechanically (ADR 0011), and a PDF page to its `page-<n>` anchor.
# - `short` are queries as an agent types them. They are scored next to the full question.
# - `api_entries`: for API questions, lookup of the first must return the first source.
# - `scored = "by hand"` lists a question without scoring it.
# - `baseline` records ranks among the top 5 hits, unfiltered and filtered to the Areas, "miss" for
#   none: before ticket 06 ("before-06") and after it ("06"). Search must not fall below the newest.
# - Ids are never reused. To drop a question, set `confidence = "rejected"`.

[categories]
API = "Exact API lookup"
SOL = "Solver-specific"
HOW = "How-to and UI"
TERM = "Terminology mismatch"
THEO = "Theory and equations"
LINK = "Crosslink to follow"
FIG = "Figure matters"
PDF = "PDF manuals"
EXP = "Example Projects"
REL = "Release notes"
LIB = "Library"
NODOC = "Not in the documentation"
LOG = "Queries agents sent (cst-help benchmark-drafts)"

